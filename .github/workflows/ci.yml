          path: Packages/BridgeCore/.build
          key: bridge-core-windows-${{ runner.arch }}-${{ hashFiles('Packages/BridgeCore/Package.resolved') }}

      - name: Build shared closure with tests
        shell: pwsh
        run: >-
          swift build --build-tests --package-path Packages/BridgeCore
