            throw "Swift installer failed with exit code $($process.ExitCode)"
          }
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Swift\bin",
            "$env:ProgramFiles\Swift\bin",
            "C:\Swift\bin"
          )
          $bin = $candidates | Where-Object { Test-Path (Join-Path $_ 'swift.exe') } | Select-Object -First 1
          if (-not $bin) {
            $found = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "$env:SystemDrive\Library" -Recurse -Filter 'swift.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $bin = $found.DirectoryName }
          }
          if (-not $bin) {
