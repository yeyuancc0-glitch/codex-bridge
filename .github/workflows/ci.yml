name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/windows-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_BRIDGE_XCODE_DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  WINDOWS_SWIFT_VERSION: "6.3.3"

jobs:
  windows-ipc-client:
    name: Windows ${{ matrix.arch }} C# IPC contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: Windows/global.json

      - name: Test C# IPC contract
        run: dotnet test Windows/BridgeIPC.Client.Tests/BridgeIPC.Client.Tests.csproj --configuration Release

      - name: Build WinUI client
        run: dotnet build Windows/CodexBridge.App/CodexBridge.App.csproj --configuration Release -p:Platform=${{ matrix.arch }}

  core:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    name: Swift package and MCP contract
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          Scripts/with-xcode.sh xcodebuild -version
          Scripts/with-xcode.sh swift --version
          node --version

      - name: Lint Swift sources
        run: >-
          Scripts/with-xcode.sh xcrun swift-format lint --strict --recursive
          Packages/BridgeCore/Sources Packages/BridgeCore/Tests UITests

      - name: Test Swift package
        run: Scripts/with-xcode.sh swift test --package-path Packages/BridgeCore

      - name: Verify MCP Inspector contract
        run: Scripts/verify-mcp-inspector.sh

      - name: Verify dependency resolution is unchanged
        run: git diff --exit-code -- Packages/BridgeCore/Package.resolved

  native:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    name: Native app and accessibility smoke test
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build unsigned app
        run: >-
          Scripts/with-xcode.sh xcodebuild
          -project CodexBridge.xcodeproj
          -scheme CodexBridge
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath .build/Xcode
          build
          CODE_SIGNING_ALLOWED=NO

      - name: Run isolated native UI test
        run: >-
          Scripts/with-xcode.sh xcodebuild
          -project CodexBridge.xcodeproj
          -scheme CodexBridge
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath .build/XcodeUITests
          -parallel-testing-enabled NO
          test

  universal2:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    name: Unsigned Universal 2 archive
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Archive both macOS architectures
        run: >-
          Scripts/with-xcode.sh xcodebuild
          -project CodexBridge.xcodeproj
          -scheme CodexBridge
          -configuration Release
          -destination 'generic/platform=macOS'
          -archivePath .build/CodexBridge.xcarchive
          archive
          CODE_SIGNING_ALLOWED=NO
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          REQUIRE_TUNNEL_HELPER=NO

      - name: Verify archived app is Universal 2
        run: |
          app=".build/CodexBridge.xcarchive/Products/Applications/CodexBridge.app/Contents/MacOS/CodexBridge"
          test -f "$app"
          architectures="$(/usr/bin/lipo -archs "$app")"
          test "$architectures" = "x86_64 arm64" || test "$architectures" = "arm64 x86_64"
          /usr/bin/lipo "$app" -verify_arch x86_64
          /usr/bin/lipo "$app" -verify_arch arm64

  windows-x64:
    name: Windows x64 shared closure
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Swift ${{ env.WINDOWS_SWIFT_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:WINDOWS_SWIFT_VERSION
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $url = "https://download.swift.org/swift-$version-release/windows10-arm64/swift-$version-RELEASE/swift-$version-RELEASE-windows10-arm64.exe"
          } else {
            $url = "https://download.swift.org/swift-$version-release/windows10/swift-$version-RELEASE/swift-$version-RELEASE-windows10.exe"
          }
          Write-Host "Downloading $url"
          $installer = "$env:RUNNER_TEMP\swift-install.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $log = "$env:RUNNER_TEMP\swift-install.log"
          $process = Start-Process -FilePath $installer -ArgumentList "/quiet", "/norestart", "/log", $log -Wait -PassThru
          Write-Host "Installer exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "Swift installer failed with exit code $($process.ExitCode)"
          }
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Swift\bin",
            "$env:ProgramFiles\Swift\bin",
            "C:\Swift\bin"
          )
          $bin = $candidates | Where-Object { Test-Path (Join-Path $_ 'swift.exe') } | Select-Object -First 1
          if (-not $bin) {
            $found = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "$env:SystemDrive\Library" -Recurse -Filter 'swift.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $bin = $found.DirectoryName }
          }
          if (-not $bin) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "swift.exe not found after installation"
          }
          # The installer splits the payload into Toolchains (compiler),
          # Runtimes (shared libraries for PATH) and Platforms (the Windows.sdk
          # that must be exposed as SDKROOT for target-library linking).
          Add-Content $env:GITHUB_PATH $bin
          $swiftRoot = Split-Path (Split-Path (Split-Path (Split-Path $bin)))
          $runtimeBin = Get-ChildItem -Path "$swiftRoot\Runtimes" -Recurse -Filter 'swiftCore.dll' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $runtimeBin) { throw "Swift runtime dlls not found under $swiftRoot\Runtimes" }
          Add-Content $env:GITHUB_PATH $runtimeBin.DirectoryName
          Add-Content $env:GITHUB_ENV "SWIFT_RUNTIME_BIN=$($runtimeBin.DirectoryName)"
          $platformSdk = Get-ChildItem -Path "$swiftRoot\Platforms" -Depth 4 -Directory -Filter 'Windows.sdk' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $platformSdk) { throw "Windows.sdk not found under $swiftRoot\Platforms" }
          Add-Content $env:GITHUB_ENV "SDKROOT=$($platformSdk.FullName)"
          if (Test-Path $log) {
            Write-Host "=== installer log tail ==="
            Get-Content $log -Tail 25 | ForEach-Object { Write-Host $_ }
          }

      - name: Activate MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install SQLite development package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $triplet = 'x64-windows'
          $vcpkg = (Get-Command vcpkg.exe -ErrorAction Stop).Source
          & $vcpkg install "sqlite3[snapshot]:$triplet" --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg sqlite3 install failed with exit code $LASTEXITCODE" }
          $installed = Join-Path (Split-Path $vcpkg) "installed\$triplet"
          $include = Join-Path $installed 'include'
          $library = Join-Path $installed 'lib'
          $runtime = Join-Path $installed 'bin'
          if (-not (Test-Path (Join-Path $include 'sqlite3.h'))) { throw "sqlite3.h not found under $include" }
          if (-not (Test-Path (Join-Path $library 'sqlite3.lib'))) { throw "sqlite3.lib not found under $library" }
          Add-Content $env:GITHUB_ENV "SQLITE_INCLUDE_DIR=$include"
          Add-Content $env:GITHUB_ENV "SQLITE_LIBRARY_DIR=$library"
          Add-Content $env:GITHUB_ENV "SQLITE_RUNTIME_DIR=$runtime"
          Add-Content $env:GITHUB_PATH $runtime

      - name: Record toolchain
        run: swift --version

      - name: Cache Windows Swift build
        id: windows-build-cache
        uses: actions/cache/restore@v4
        with:
          path: Packages/BridgeCore/.build
          key: bridge-core-windows-${{ runner.arch }}-${{ hashFiles('Packages/BridgeCore/Package.resolved') }}

      - name: Build shared closure with tests
        shell: pwsh
        run: >-
          swift build --build-tests --package-path Packages/BridgeCore
          -Xcc "-I$env:SQLITE_INCLUDE_DIR"
          -Xlinker "/LIBPATH:$env:SQLITE_LIBRARY_DIR"

      - name: Require native process fixture
        shell: pwsh
        run: |
          $bin = swift build --show-bin-path --package-path Packages/BridgeCore
          $fixture = Join-Path $bin 'windows-process-tree-fixture.exe'
          if (-not (Test-Path $fixture)) {
            throw "Windows process fixture was not built at $fixture"
          }
          Add-Content $env:GITHUB_ENV "BRIDGE_WINDOWS_PROCESS_FIXTURE=$fixture"

      - name: Test shared closure
        shell: pwsh
        run: .github/scripts/run-windows-test-targets.ps1

      - name: Install .NET SDK for Service IPC probe
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: Windows/global.json

      - name: Probe real Service dispatcher from C#
        shell: pwsh
        run: .github/scripts/run-windows-service-probe.ps1

      - name: Build unsigned x64 MSIX
        shell: pwsh
        run: .github/scripts/package-windows-msix.ps1 -Architecture x64

      - name: Upload unsigned x64 MSIX
        uses: actions/upload-artifact@v6
        with:
          name: CodexBridge-Windows-x64-unsigned
          path: Windows/CodexBridge.App/**/AppPackages/**/*.msix
          if-no-files-found: error

      - name: Build x64 EXE installer and portable archive
        id: unpackaged
        shell: pwsh
        run: >-
          .github/scripts/package-windows-unpackaged.ps1
          -Architecture x64
          -OutputDirectory '${{ runner.temp }}/unpackaged-output'
          -AppVersion '0.2.0.0'

      - name: Test x64 portable archive
        shell: pwsh
        run: .github/scripts/test-windows-portable.ps1 -ArchivePath '${{ steps.unpackaged.outputs.portable }}'

      - name: Test x64 EXE installer
        shell: pwsh
        run: .github/scripts/test-windows-exe-install.ps1 -InstallerPath '${{ steps.unpackaged.outputs.setup }}'

      - name: Upload x64 App startup diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: CodexBridge-Windows-x64-app-diagnostics
          path: |
            ${{ runner.temp }}/CodexBridge-EXE-*.log
            ${{ runner.temp }}/CodexBridge.App.dmp
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload x64 EXE and portable artifacts
        if: always() && steps.unpackaged.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: CodexBridge-Windows-x64-unpackaged
          path: ${{ runner.temp }}/unpackaged-output/*
          if-no-files-found: error

      - name: Save Windows Swift build cache
        if: always() && steps.windows-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Packages/BridgeCore/.build
          key: bridge-core-windows-${{ runner.arch }}-${{ hashFiles('Packages/BridgeCore/Package.resolved') }}

  windows-arm64:
    name: Windows ARM64 shared closure
    runs-on: windows-11-arm
    timeout-minutes: 70
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Swift ${{ env.WINDOWS_SWIFT_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:WINDOWS_SWIFT_VERSION
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $url = "https://download.swift.org/swift-$version-release/windows10-arm64/swift-$version-RELEASE/swift-$version-RELEASE-windows10-arm64.exe"
          } else {
            $url = "https://download.swift.org/swift-$version-release/windows10/swift-$version-RELEASE/swift-$version-RELEASE-windows10.exe"
          }
