name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_BRIDGE_XCODE_DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  core:
    name: Swift package
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          Scripts/with-xcode.sh xcodebuild -version
          Scripts/with-xcode.sh swift --version

      - name: Lint Swift sources
        run: >-
          Scripts/with-xcode.sh xcrun swift-format lint --strict --recursive
          Packages/BridgeCore/Sources App Service

      - name: Build Swift package
        run: Scripts/with-xcode.sh swift build --package-path Packages/BridgeCore

      - name: Verify dependency resolution is unchanged
        run: git diff --exit-code -- Packages/BridgeCore/Package.resolved

  native:
    name: Native app
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build unsigned app
        run: >-
          Scripts/with-xcode.sh xcodebuild
          -project CodexBridge.xcodeproj
          -scheme CodexBridge
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath .build/Xcode
          build
          CODE_SIGNING_ALLOWED=NO

  universal2:
    name: Unsigned Universal 2 archive
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Archive both macOS architectures
        run: >-
          Scripts/with-xcode.sh xcodebuild
          -project CodexBridge.xcodeproj
          -scheme CodexBridge
          -configuration Release
          -destination 'generic/platform=macOS'
          -archivePath .build/CodexBridge.xcarchive
          archive
          CODE_SIGNING_ALLOWED=NO
          ARCHS='arm64 x86_64'
          ONLY_ACTIVE_ARCH=NO
          REQUIRE_TUNNEL_HELPER=NO

      - name: Verify archived app is Universal 2
        run: |
          app=".build/CodexBridge.xcarchive/Products/Applications/CodexBridge.app/Contents/MacOS/CodexBridge"
          test -f "$app"
          architectures="$(/usr/bin/lipo -archs "$app")"
          test "$architectures" = "x86_64 arm64" || test "$architectures" = "arm64 x86_64"
          /usr/bin/lipo "$app" -verify_arch x86_64
          /usr/bin/lipo "$app" -verify_arch arm64
