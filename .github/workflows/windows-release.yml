name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag to receive the Windows release assets.
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  WINDOWS_SWIFT_VERSION: '6.3.3'
  PACKAGE_IDENTITY_NAME: org.codexbridge.windows

jobs:
  prepare:
    name: Validate release configuration
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      package-version: ${{ steps.release.outputs.package-version }}
    steps:
      - name: Resolve release identity
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RUN_NUMBER: ${{ github.run_number }}
          PUBLISHER: ${{ vars.WINDOWS_PACKAGE_PUBLISHER }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:REF_TAG) { $env:REF_TAG } else { $env:REQUESTED_TAG }
          if ($tag -notmatch '^v(\d{1,5})\.(\d{1,5})\.(\d{1,5})(?:[-+].*)?$') {
            throw 'Release tag must start with vMAJOR.MINOR.PATCH.'
          }
          foreach ($name in @('PUBLISHER', 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE', 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Windows release configuration is missing $name."
            }
          }
          $revision = [int]$env:RUN_NUMBER
          if ($revision -gt 65535) { throw 'GitHub run number exceeds the MSIX revision range.' }
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).$revision"
          Add-Content $env:GITHUB_OUTPUT "tag=$tag"
          Add-Content $env:GITHUB_OUTPUT "package-version=$version"

  build:
    name: Build Windows ${{ matrix.arch }} release package
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: Windows/global.json

      - name: Set up native toolchain
        uses: ./.github/actions/setup-windows-build
        with:
          architecture: ${{ matrix.arch }}
          swift-version: ${{ env.WINDOWS_SWIFT_VERSION }}

      - name: Build Swift Service
        shell: pwsh
        run: >-
          swift build --product codex-bridge-service --package-path Packages/BridgeCore
          -Xcc "-I$env:SQLITE_INCLUDE_DIR"
          -Xlinker "/LIBPATH:$env:SQLITE_LIBRARY_DIR"

      - name: Build self-contained MSIX
        id: package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
          PACKAGE_PUBLISHER: ${{ vars.WINDOWS_PACKAGE_PUBLISHER }}
          PACKAGE_NAME: ${{ env.PACKAGE_IDENTITY_NAME }}
        run: >-
          .github/scripts/package-windows-msix.ps1
          -Architecture ${{ matrix.arch }}
          -PackageVersion $env:PACKAGE_VERSION
          -Publisher $env:PACKAGE_PUBLISHER
          -IdentityName $env:PACKAGE_NAME

      - name: Upload unsigned architecture package
        uses: actions/upload-artifact@v6
        with:
          name: CodexBridge-Windows-${{ matrix.arch }}-release-input
          path: ${{ steps.package.outputs.msix }}
          if-no-files-found: error
          retention-days: 3

  sign-and-publish:
    name: Sign and publish Windows release
    needs: [prepare, build]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Download architecture packages
        uses: actions/download-artifact@v7
        with:
          pattern: CodexBridge-Windows-*-release-input
          path: ${{ runner.temp }}/release-input
          merge-multiple: true

      - name: Build MSIX bundle and App Installer feed
        id: bundle
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ runner.temp }}/release-input
          RELEASE_OUTPUT: ${{ runner.temp }}/release-output
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
          PACKAGE_PUBLISHER: ${{ vars.WINDOWS_PACKAGE_PUBLISHER }}
          PACKAGE_NAME: ${{ env.PACKAGE_IDENTITY_NAME }}
          RELEASE_BASE_URI: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}
        run: >-
          .github/scripts/bundle-windows-release.ps1
          -InputDirectory $env:RELEASE_INPUT
          -OutputDirectory $env:RELEASE_OUTPUT
          -PackageVersion $env:PACKAGE_VERSION
          -Publisher $env:PACKAGE_PUBLISHER
          -IdentityName $env:PACKAGE_NAME
          -ReleaseBaseUri $env:RELEASE_BASE_URI

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign MSIX bundle with Artifact Signing
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.bundle.outputs.bundle }}
          file-digest: SHA256
          timestamp-digest: SHA256

      - name: Verify signature
        shell: pwsh
        run: |
          $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $signTool) {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $signTool) { throw 'signtool.exe was not found.' }
          $signToolPath = if ($signTool.Source) { $signTool.Source } else { $signTool.FullName }
          & $signToolPath verify /pa /v '${{ steps.bundle.outputs.bundle }}'
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed with exit code $LASTEXITCODE" }

      - name: Generate Microsoft SPDX SBOM and checksums
        shell: pwsh
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/release-output
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Join-Path $env:RUNNER_TEMP 'sbom-tool.exe'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/sbom-tool/releases/download/v4.1.5/sbom-tool-win-x64.exe' -OutFile $tool
          $hash = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne '625767b371b7fdd58f40f618b8a86da0247a33c89e419039c86b4edba1dad4b5') {
            throw "SBOM tool digest mismatch: $hash"
          }
          & $tool generate -b $env:RELEASE_OUTPUT -bc $pwd -pn CodexBridge-Windows -pv $env:PACKAGE_VERSION -ps CodexBridge -nsb "https://github.com/${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed with exit code $LASTEXITCODE" }
          $manifest = Join-Path $env:RELEASE_OUTPUT '_manifest/spdx_2.2/manifest.spdx.json'
          Move-Item -LiteralPath $manifest -Destination (Join-Path $env:RELEASE_OUTPUT 'CodexBridge-Windows.spdx.json')
          Remove-Item -LiteralPath (Join-Path $env:RELEASE_OUTPUT '_manifest') -Recurse -Force
          $assets = Get-ChildItem -Path $env:RELEASE_OUTPUT -File | Sort-Object Name
          $lines = foreach ($asset in $assets) {
            $digest = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($asset.Name)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $env:RELEASE_OUTPUT 'SHA256SUMS.txt'),
            $lines,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v6
        with:
          name: CodexBridge-Windows-signed
          path: ${{ runner.temp }}/release-output/*
          if-no-files-found: error

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_OUTPUT: ${{ runner.temp }}/release-output
        run: |
          $ErrorActionPreference = 'Stop'
          & gh release view $env:RELEASE_TAG --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            & gh release create $env:RELEASE_TAG --repo '${{ github.repository }}' --verify-tag --draft --title "Codex Bridge $env:RELEASE_TAG" --notes 'Windows signed release assets.'
            if ($LASTEXITCODE -ne 0) { throw "Unable to create release $env:RELEASE_TAG" }
          }
          $assets = @(Get-ChildItem -Path $env:RELEASE_OUTPUT -File | ForEach-Object { $_.FullName })
          & gh release upload $env:RELEASE_TAG @assets --repo '${{ github.repository }}' --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload Windows release assets" }
