name: windows

on:
  push:
    branches: [win]
  pull_request:
    branches: [win]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            swift-url: https://download.swift.org/swift-6.1.2-release/windows10/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-windows10.exe
          - os: windows-11-arm
            swift-url: https://download.swift.org/swift-6.1.2-release/windows10-arm64/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-windows10-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.1.2 toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ matrix.swift-url }}" -OutFile swift-installer.exe
          $proc = Start-Process -Wait -PassThru -FilePath .\swift-installer.exe `
            -ArgumentList "/quiet", "/norestart"
          Remove-Item .\swift-installer.exe
          Write-Host "installer exit code: $($proc.ExitCode)"
          $roots = @(
            "$env:LOCALAPPDATA\Programs\Swift",
            "C:\Library\Developer\Toolchains",
            "$env:ProgramFiles\Swift"
          )
          $swiftExe = Get-ChildItem $roots -Recurse -Filter swift.exe `
            -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $swiftExe) { throw "swift.exe not found after install" }
          Write-Host "found swift at $swiftExe"
          Add-Content $env:GITHUB_PATH (Split-Path $swiftExe)
      - name: Build service and Windows shell
        working-directory: Packages/BridgeCore
        shell: pwsh
        run: |
          swift build --product codex-bridge-service
          swift build --product codex-bridge-windows-app
      - name: Smoke tests (platform-neutral targets)
        working-directory: Packages/BridgeCore
        shell: pwsh
        run: |
          swift test --filter "BridgeDomainTests|BridgeCodexRPCTests|BridgeAgentCoreTests"
