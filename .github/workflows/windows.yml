name: windows

on:
  push:
    branches: [win]
  pull_request:
    branches: [win]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.architecture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            triplet: x64-windows
            library_architecture: x64
            target_triple: ""
            run_tests: true
          - architecture: arm64
            triplet: arm64-windows
            library_architecture: arm64
            target_triple: aarch64-unknown-windows-msvc
            run_tests: false
    steps:
      - uses: actions/checkout@v4
      - name: Exclude build directories from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE "Packages")
          Add-MpPreference -ExclusionProcess "swift-frontend.exe"
          Add-MpPreference -ExclusionProcess "swift.exe"
          Add-MpPreference -ExclusionProcess "clang.exe"
          Add-MpPreference -ExclusionProcess "lld-link.exe"
      - name: Install Swift 6.3.3 toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.swift.org/swift-6.3.3-release/windows10/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10.exe" -OutFile swift-installer.exe
          $proc = Start-Process -Wait -PassThru -FilePath .\swift-installer.exe `
            -ArgumentList "/quiet", "/norestart", "InstallPerMachine=1"
          Remove-Item .\swift-installer.exe
          Write-Host "installer exit code: $($proc.ExitCode)"
          $roots = @(
            "$env:ProgramFiles\Swift",
            "$env:LOCALAPPDATA\Programs\Swift",
            "C:\Library\Developer\Toolchains"
          )
          $candidates = Get-ChildItem $roots -Recurse -Filter swift.exe `
            -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          # Prefer the standard toolchain over the +Asserts variant.
          $swiftExe = ($candidates | Where-Object { $_ -notmatch '\+Asserts' } |
            Select-Object -First 1)
          if (-not $swiftExe) { $swiftExe = $candidates | Select-Object -First 1 }
          if (-not $swiftExe) { throw "swift.exe not found after install" }
          Write-Host "found swift at $swiftExe"
          Add-Content $env:GITHUB_PATH (Split-Path $swiftExe)
          # The bundle ships host-tool runtime libraries (swiftCore.dll etc.)
          # in a separate Runtime Libraries directory that must be on PATH.
          $searchRoots = @(
            (Split-Path (Split-Path (Split-Path (Split-Path $swiftExe)))),
            "$env:LOCALAPPDATA\Programs",
            "C:\Library"
          )
          $runtimeBin = $searchRoots | ForEach-Object {
            if (Test-Path $_) {
              Get-ChildItem $_ -Recurse -Filter swiftCore.dll `
                -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
            }
          } | Where-Object { $_ } | Select-Object -First 1
          if (-not $runtimeBin) { throw "swiftCore.dll not found after install" }
          Write-Host "found runtime at $runtimeBin"
          Add-Content $env:GITHUB_PATH $runtimeBin
          # The installer ships a bundled Windows SDK (Platforms) and points
          # SDKROOT at it, but env changes made by the installer do not reach
          # already running job steps; forward it explicitly. Fall back to the
          # system Windows Kits installation.
          $platformDir = $searchRoots | ForEach-Object {
            if (Test-Path $_) {
              Get-ChildItem $_ -Recurse -Directory -Filter "Windows.platform" `
                -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            }
          } | Where-Object { $_ } | Select-Object -First 1
          if ($platformDir) {
            $sdkRoot = Join-Path $platformDir "Developer\SDKs\Windows.sdk"
          } else {
            $sdkRoot = "C:\Program Files (x86)\Windows Kits\10"
          }
          Write-Host "SDKROOT=$sdkRoot"
          Add-Content $env:GITHUB_ENV "SDKROOT=$sdkRoot"
      - name: Install SQLite via vcpkg (for GRDB)
        shell: pwsh
        run: |
          $triplet = "${{ matrix.triplet }}"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "sqlite3:$triplet"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archDir = "${{ matrix.library_architecture }}"
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath | Select-Object -First 1
          $msvcRoot = Get-ChildItem "$vsRoot\VC\Tools\MSVC" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          $kitsLib = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" -Directory `
            -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          $kitsInc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory `
            -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          $inc = @(
            "$env:VCPKG_INSTALLATION_ROOT\installed\$triplet\include",
            "$msvcRoot\include",
            "$kitsInc\ucrt",
            "$kitsInc\um",
            "$kitsInc\shared",
            "$kitsInc\winrt"
          ) -join ";"
          Add-Content $env:GITHUB_ENV "INCLUDE=$inc"
          # Preflight the target libraries. ARM64 keeps the host LIB untouched
          # so SwiftPM can compile its x64 manifest, then receives these paths
          # as target linker arguments in the build step.
          $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath | Select-Object -First 1
          $msvcLib = Get-ChildItem "$vsRoot\VC\Tools\MSVC" -Directory |
            Sort-Object Name -Descending | ForEach-Object { "$($_.FullName)\lib\$archDir" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          $kitsLib = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" -Directory `
            -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          $vcpkgLib = "$env:VCPKG_INSTALLATION_ROOT\installed\$triplet\lib"
          $sdkUM = "$kitsLib\um\$archDir"
          $sdkUCRT = "$kitsLib\ucrt\$archDir"
          $requiredLibraries = @(
            "$vcpkgLib\sqlite3.lib",
            "$msvcLib\libcmt.lib",
            "$sdkUM\kernel32.lib",
            "$sdkUM\runtimeobject.lib",
            "$sdkUCRT\ucrt.lib"
          )
          foreach ($library in $requiredLibraries) {
            if (-not (Test-Path $library)) {
              throw "Required $archDir library is unavailable: $library"
            }
          }
          $targetLibraryPaths = @($vcpkgLib, $msvcLib, $sdkUM, $sdkUCRT) -join ";"
          Add-Content $env:GITHUB_ENV "TARGET_LIBRARY_PATHS=$targetLibraryPaths"
          $vcRedistRoot = Get-ChildItem "$vsRoot\VC\Redist\MSVC" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $vcRedistRoot) { throw "Visual C++ Redistributable files are unavailable." }
          Add-Content $env:GITHUB_ENV "CODEX_BRIDGE_VC_REDIST_ROOT=$vcRedistRoot"
          if ($archDir -eq "x64") {
            Write-Host "LIB=$targetLibraryPaths"
            Add-Content $env:GITHUB_ENV "LIB=$targetLibraryPaths"
          }
      - name: Build service and Windows shell
        working-directory: Packages/BridgeCore
        shell: pwsh
        run: |
          swift --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targetTriple = "${{ matrix.target_triple }}"
          $swiftArguments = @("-Xswiftc", "-DSQLITE_DISABLE_SNAPSHOT")
          if ($targetTriple) {
            $swiftArguments += @("--triple", $targetTriple)
            foreach ($libraryPath in ($env:TARGET_LIBRARY_PATHS -split ";")) {
              $swiftArguments += @("-Xlinker", "-libpath:$libraryPath")
            }
          }
          $buildArguments = @($swiftArguments) + @("-c", "release")
          swift build @buildArguments --product codex-bridge-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build @buildArguments --product codex-bridge-windows-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binPathOutput = & swift build @buildArguments --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binPath = ($binPathOutput | Select-Object -Last 1).ToString().Trim()
          if (-not $binPath) { throw "Swift build output directory was empty." }
          Add-Content $env:GITHUB_ENV "SWIFT_BIN_PATH=$binPath"
      - name: Smoke tests
        if: matrix.run_tests
        working-directory: Packages/BridgeCore
        shell: pwsh
        run: |
          swift test -Xswiftc -DSQLITE_DISABLE_SNAPSHOT --filter "BridgeDomainTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift test -Xswiftc -DSQLITE_DISABLE_SNAPSHOT --filter "BridgeAgentCoreTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift test -Xswiftc -DSQLITE_DISABLE_SNAPSHOT --filter "BridgeSecurityTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift test -Xswiftc -DSQLITE_DISABLE_SNAPSHOT --filter "BridgeCodexRPCTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift test -Xswiftc -DSQLITE_DISABLE_SNAPSHOT --filter "BridgeServiceAppCoreTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage Windows portable package
        shell: pwsh
        run: |
          $targetTriple = "${{ matrix.target_triple }}"
          $portableDir = Join-Path $env:GITHUB_WORKSPACE ".build\windows-dist\${{ matrix.architecture }}"
          $stageArguments = @{
            BinPath = $env:SWIFT_BIN_PATH
            OutDir = $portableDir
            Architecture = "${{ matrix.architecture }}"
            VcpkgTriplet = "${{ matrix.triplet }}"
          }
          if ($targetTriple) {
            $stageArguments["TargetTriple"] = $targetTriple
          }
          & "$env:GITHUB_WORKSPACE\Scripts\stage-windows-portable.ps1" @stageArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke portable service startup
        if: matrix.run_tests
        shell: pwsh
        run: |
          $portableDir = Join-Path $env:GITHUB_WORKSPACE ".build\windows-dist\${{ matrix.architecture }}"
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("codex-bridge-portable-" + [Guid]::NewGuid().ToString("N"))
          $dataRoot = Join-Path $smokeRoot "data"
          $stdoutPath = Join-Path $smokeRoot "stdout.txt"
          $stderrPath = Join-Path $smokeRoot "stderr.txt"
          New-Item -ItemType Directory -Path $dataRoot -Force | Out-Null
          $originalPath = $env:PATH
          $process = $null
          try {
            $env:PATH = "$portableDir;$env:SystemRoot\System32;$env:SystemRoot"
            $process = Start-Process -FilePath (Join-Path $portableDir "codex-bridge-service.exe") `
              -ArgumentList @("--foreground", "--data-root", "`"$dataRoot`"") `
              -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath `
              -NoNewWindow -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $ready = $false
            while ([DateTime]::UtcNow -lt $deadline -and -not $process.HasExited) {
              if (Test-Path -LiteralPath $stdoutPath) {
                $output = Get-Content -LiteralPath $stdoutPath -Raw -ErrorAction SilentlyContinue
                if ($output -match "Codex Bridge service ready on 127\.0\.0\.1:\d+\.") {
                  $ready = $true
                  break
                }
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) {
              $failure = if (Test-Path -LiteralPath $stderrPath) {
                Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue
              } else { "no stderr" }
              throw "Portable service did not reach readiness: $failure"
            }
            $portableRoot = ([IO.Path]::GetFullPath($portableDir)).TrimEnd("\") + "\"
            $vcModules = @($process.Modules |
                Where-Object { $_.ModuleName -match "^(concrt|msvcp|vccorlib|vcruntime)[^.]*\.dll$" })
            foreach ($vcModule in $vcModules) {
              $modulePath = [IO.Path]::GetFullPath($vcModule.FileName)
              if (-not $modulePath.StartsWith($portableRoot, [StringComparison]::OrdinalIgnoreCase)) {
                throw "Visual C++ runtime was loaded outside the portable directory: $modulePath"
              }
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $process.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
            $env:PATH = $originalPath
            if (Test-Path -LiteralPath $smokeRoot) {
              Remove-Item -LiteralPath $smokeRoot -Recurse -Force
            }
          }
      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: codex-bridge-windows-${{ matrix.architecture }}
          path: .build/windows-dist/codex-bridge-windows-${{ matrix.architecture }}.zip
          if-no-files-found: error
