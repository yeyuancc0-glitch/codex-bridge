name: windows

on:
  push:
    branches: [win]
  pull_request:
    branches: [win]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            swift-url: https://download.swift.org/swift-6.2.2-release/windows10/swift-6.2.2-RELEASE/swift-6.2.2-RELEASE-windows10.exe
          - os: windows-11-arm
            swift-url: https://download.swift.org/swift-6.2.2-release/windows10-arm64/swift-6.2.2-RELEASE/swift-6.2.2-RELEASE-windows10-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.2.2 toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ matrix.swift-url }}" -OutFile swift-installer.exe
          $proc = Start-Process -Wait -PassThru -FilePath .\swift-installer.exe `
            -ArgumentList "/quiet", "/norestart", "InstallPerMachine=1"
          Remove-Item .\swift-installer.exe
          Write-Host "installer exit code: $($proc.ExitCode)"
          $roots = @(
            "$env:ProgramFiles\Swift",
            "$env:LOCALAPPDATA\Programs\Swift",
            "C:\Library\Developer\Toolchains"
          )
          $candidates = Get-ChildItem $roots -Recurse -Filter swift.exe `
            -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          # Prefer the standard toolchain over the +Asserts variant.
          $swiftExe = ($candidates | Where-Object { $_ -notmatch '\+Asserts' } |
            Select-Object -First 1)
          if (-not $swiftExe) { $swiftExe = $candidates | Select-Object -First 1 }
          if (-not $swiftExe) { throw "swift.exe not found after install" }
          Write-Host "found swift at $swiftExe"
          Add-Content $env:GITHUB_PATH (Split-Path $swiftExe)
      - name: Build service and Windows shell
        working-directory: Packages/BridgeCore
        shell: pwsh
        run: |
          $bin = (Get-Command swift).Source | Split-Path
          Write-Host "toolchain bin: $bin"
          Write-Host "--- Swift install root ---"
          Get-ChildItem (Split-Path (Split-Path $bin)) | Select-Object Name
          Write-Host "--- toolchain root ---"
          Get-ChildItem (Split-Path $bin) | Select-Object Name
          Write-Host "--- swift executables ---"
          Get-ChildItem $bin -Filter "swift*.exe" | Select-Object Name
          Write-Host "--- dll count ---"
          (Get-ChildItem $bin -Filter "*.dll").Count
          Write-Host "--- swift.exe --version ---"
          & "$bin\swift.exe" --version
          Write-Host "swift exit=$LASTEXITCODE"
          Write-Host "--- swift-build.exe --version ---"
          & "$bin\swift-build.exe" --version
          Write-Host "swift-build exit=$LASTEXITCODE"
          Write-Host "--- swift-frontend.exe --version ---"
          & "$bin\swift-frontend.exe" --version
          Write-Host "frontend exit=$LASTEXITCODE"
          Write-Host "--- usr\bin dll names ---"
          (Get-ChildItem $bin -Filter "*.dll").Name -join ", "
          Write-Host "--- dumpbin dependents ---"
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -find "**\dumpbin.exe" | Select-Object -First 1
          if ($dumpbin) {
            & $dumpbin /dependents "$bin\swift.exe" | Select-Object -Skip 1
          } else {
            Write-Host "dumpbin not found"
          }
      - name: Smoke tests (platform-neutral targets)
        working-directory: Packages/BridgeCore
        shell: pwsh
        run: |
          swift test --filter "BridgeDomainTests|BridgeCodexRPCTests|BridgeAgentCoreTests"
